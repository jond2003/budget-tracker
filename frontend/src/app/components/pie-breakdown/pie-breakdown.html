<div class="w-full max-w-md rounded-xl bg-white p-6 shadow">
  <h2 class="mb-4 text-lg font-semibold text-gray-900">
    Spending by category
  </h2>

  <div class="relative mx-auto aspect-square max-w-sm">
    <svg
      viewBox="0 0 200 200"
      class="h-full w-full"
    >
      @for (slice of slices(); track slice.category_id; let i = $index) {
        <path
          [attr.d]="slice.path"
          [attr.fill]="slice.colour"
          class="cursor-pointer transition-opacity duration-150 hover:opacity-75"
          (mouseenter)="hoverSlice(slice)"
          (mouseleave)="clearHover()"
        />
      }
    </svg>

    @if (hoveredCategory(); as category) {
      <div
        class="pointer-events-none absolute left-1/2 top-1/2
               -translate-x-1/2 -translate-y-1/2
               rounded-lg bg-gray-900 px-3 py-2
               text-center text-sm text-white shadow-lg"
      >
        <div class="font-semibold">
          {{ category.name }}
        </div>

        <div class="text-gray-300">
          {{ category.amount | currency: 'GBP' }}
        </div>

        <div class="text-xs text-gray-400">
          {{ category.percentage * 100 | number:'1.0-1' }}%
        </div>
      </div>
    }
  </div>
</div>
